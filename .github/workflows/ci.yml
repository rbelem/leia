name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Format check (release docs and publish scripts only)
        run: npx prettier --check store/publishing store/copy scripts/publish-chrome.mjs scripts/publish-firefox.mjs scripts/publish-edge.mjs scripts/cdp-drive.mjs

      - name: Store-kit gate (text limits, manifest agreement, asset dimensions)
        run: node scripts/store-check.mjs

  popup-window:
    # The 114px popup shipped because no check rendered the popup AS a popup
    # window: jsdom has no layout, and viewport emulation cannot see this bug
    # (an emulator sets the viewport, so a width-less body fills it). This job
    # opens the real popup headless via chrome.action.openPopup() and asserts
    # it lands at 320px with nothing overflowing. Needs no desktop or display.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build both targets
        run: npm run build

      - name: Install unbranded Chromium
        id: setup-chromium
        # Pinned SHA of setup-chrome v2.2.0. chrome-version latest means the
        # latest Chromium snapshot (unbranded); default stable would be Chrome
        # for Testing, and branded Google Chrome ignores --load-extension
        # entirely ("not allowed in Google Chrome", verified live on Chrome
        # 156), so the extension under test would never load there.
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: latest

      - name: Popup opens as a popup window at 320px
        timeout-minutes: 5
        run: node scripts/check-popup-window.mjs
        env:
          CHROME_BIN: ${{ steps.setup-chromium.outputs.chrome-path }}

      - name: Popup opens as a popup window at 320px
        run: node scripts/check-popup-window.mjs

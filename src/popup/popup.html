<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leia</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    p.note { margin: 0 0 10px; color: #6b7280; font-size: 12px; }
    label { display: block; margin: 8px 0 2px; color: #374151; }
    select { width: 100%; padding: 4px 6px; font: inherit; }
    button { width: 100%; margin: 4px 0; padding: 6px 8px; text-align: left; }
    #status { margin-top: 8px; color: #6b7280; font-size: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Leia</h1>
  <p class="note">Select text on a page, then press <b>Read selection</b> in the floating bar (bottom-right).</p>

  <button id="read-selection">Read selection (active tab)</button>
  <div id="status">—</div>

  <label for="voice">Voice (Web Speech)</label>
  <select id="voice"><option value="">(default voice)</option></select>

  <label for="speed">Speed</label>
  <select id="speed"></select>

  <script src="popup.js"></script>
</body>
</html>

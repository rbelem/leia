<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leia</title>
  <style>
    :root {
      --bg: #faf9f7;
      --panel: #ffffff;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.12);
      --ok: #15803d;
      --error: #b91c1c;
      --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --panel: #292524;
        --ink: #f5f5f4;
        --muted: #a8a29e;
        --line: #44403c;
        --accent: #fbbf24;
        --accent-soft: rgba(251, 191, 36, 0.14);
        --ok: #4ade80;
        --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px 14px 18px;
      font: 12.5px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header.masthead { margin-bottom: 12px; }
    header.masthead h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
    header.masthead .tagline { margin: 1px 0 0; color: var(--muted); font-size: 11.5px; }

    section { border-top: 1px solid var(--line); padding: 10px 0 12px; }
    section > h2 {
      margin: 0 0 8px;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hint { margin: 0 0 8px; color: var(--muted); font-size: 11px; }

    select, input {
      width: 100%;
      padding: 6px 8px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    select:focus, input:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    optgroup { font-style: normal; }
    optgroup[disabled] { color: var(--muted); }

    button {
      font: inherit;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 6px 10px;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease, filter 0.12s ease, transform 0.06s ease;
    }
    button:not(:disabled):active { transform: scale(0.96); }
    button.primary {
      width: 100%;
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) { button.primary { color: #1c1917; } }
    button.primary:hover:not(:disabled) { filter: brightness(1.06); }
    button.primary:not(:disabled):active { filter: brightness(0.94); transform: scale(0.98); }
    button.ghost { padding: 5px 8px; font-size: 11.5px; color: var(--muted); }
    button.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
    button:disabled { opacity: 0.5; cursor: default; }

    .transport button:not(.primary):hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--muted);
      background: var(--accent-soft);
    }
    button.loading { cursor: progress; }
    .pp-spin {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 5px;
      vertical-align: -1px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: leia-spin 0.8s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      .pp-spin { border-color: rgba(28, 25, 23, 0.35); border-top-color: #1c1917; }
    }
    @keyframes leia-spin { to { transform: rotate(360deg); } }

    .voice-row { display: flex; align-items: center; gap: 8px; }
    .voice-row select { flex: 1; min-width: 0; }

    .transport { display: flex; gap: 6px; margin-bottom: 6px; }
    .transport .primary { flex: 1; width: auto; }
    #open-in-page { margin-bottom: 6px; }

    .reader-error {
      margin: 4px 0 0;
      font-size: 11px;
      color: var(--error);
    }
    .resume-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .resume-row[hidden] { display: none; }
    .resume-row button { padding: 2px 6px; font-size: 11px; }

    #status {
      margin: 4px 0 8px;
      min-height: 1.2em;
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .field > span { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 18px; }
    .chip {
      font-size: 10.5px;
      line-height: 1;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel);
    }

    .swatches { display: flex; gap: 8px; }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid transparent;
      background: none;
    }
    .swatch-chip {
      width: 34px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .swatch-label { font-size: 10px; color: var(--muted); }
    .swatch[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .swatch[aria-checked="true"] .swatch-label { color: var(--ink); font-weight: 600; }

    .provider { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 8px; margin-bottom: 8px; }
    .provider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .provider-name { font-weight: 600; }
    .provider-state { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .provider-state.ok { color: var(--ok); }
    .provider-fields { display: flex; gap: 6px; }
    .provider-fields .key-input { flex: 1; min-width: 0; }
    .provider input.region { margin-top: 6px; }
  </style>
</head>
<body>
  <header class="masthead">
    <h1>Leia</h1>
    <p class="tagline">Select text on a page, then read it aloud.</p>
  </header>

  <section aria-label="Playback">
    <h2>Playback</h2>
    <div id="playback-controls" hidden>
      <div class="transport">
        <button id="pp-back" type="button" title="Previous sentence" aria-label="Previous sentence" disabled>⏮</button>
        <button id="pp-play" type="button" class="primary" aria-label="Play">▶ Play</button>
        <button id="pp-fwd" type="button" title="Next sentence" aria-label="Next sentence" disabled>⏭</button>
        <button id="pp-stop" type="button" title="Stop" aria-label="Stop" disabled>⏹</button>
      </div>
      <button id="open-in-page" type="button" class="ghost">Open controls in page</button>
    </div>
    <div id="status" role="status">no active session</div>
    <div id="reader-error" class="reader-error" hidden></div>
    <div id="resume-row" class="resume-row" hidden>
      <span id="resume-label"></span>
      <button id="resume-clear" class="ghost">clear</button>
    </div>
    <label class="field">
      <span>Speed</span>
      <select id="speed"></select>
    </label>
  </section>

  <section aria-label="Voice">
    <h2>Voice</h2>
    <div class="voice-row">
      <select id="voice" aria-label="Voice"><option value="">(default voice)</option></select>
      <button id="preview-voice" class="ghost" type="button" disabled>Preview</button>
    </div>
    <div id="preview-note" class="hint" hidden></div>
    <div id="family-hint" class="hint" hidden></div>
    <div id="capabilities" class="chips" aria-label="Engine capabilities"></div>
  </section>

  <section aria-label="Highlight theme">
    <h2>Highlight theme</h2>
    <div id="theme-swatches" class="swatches" role="radiogroup"></div>
  </section>

  <section aria-label="Providers">
    <h2>Providers</h2>
    <p class="hint">Add your own API key to enable a voice provider. Keys stay in this browser.</p>
    <div id="providers"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>

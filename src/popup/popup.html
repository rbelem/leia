<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leia</title>
  <link rel="stylesheet" href="../ui/base.css" />
</head>
<body class="popup">
  <header class="masthead">
    <h1>Leia</h1>
    <p class="tagline">Select text on a page, then read it aloud.</p>
  </header>

  <section aria-label="Playback">
    <h2>Playback</h2>
    <div id="playback-controls" hidden>
      <div class="transport">
        <button id="pp-back" type="button" title="Previous sentence" aria-label="Previous sentence" disabled><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 5h2.5v14H6z"/><path d="M19 5v14L9.5 12z"/></svg></button>
        <button id="pp-play" type="button" class="primary" aria-label="Play"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg><span class="play-label">Play</span></button>
        <button id="pp-fwd" type="button" title="Next sentence" aria-label="Next sentence" disabled><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><path d="M15.5 5H18v14h-2.5z"/><path d="M5 5v14L14.5 12z"/></svg></button>
        <button id="pp-stop" type="button" title="Stop" aria-label="Stop" disabled><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
      <button id="open-in-page" type="button" class="ghost">Open controls in page</button>
    </div>
    <div id="status" role="status">no active session</div>
    <div id="reader-error" class="reader-error" hidden></div>
    <div id="resume-row" class="resume-row" hidden>
      <span id="resume-label"></span>
      <button id="resume-clear" class="ghost">clear</button>
    </div>
    <label class="field">
      <span>Speed</span>
      <select id="speed"></select>
    </label>
  </section>

  <section aria-label="Voice">
    <h2>Voice</h2>
    <div class="voice-row">
      <select id="voice" aria-label="Voice"><option value="">(default voice)</option></select>
      <button id="preview-voice" class="ghost" type="button" disabled>Preview</button>
    </div>
    <div id="preview-note" class="hint" role="status" hidden></div>
    <div id="family-hint" class="hint" hidden></div>
    <div id="capabilities" class="chips" aria-label="Engine capabilities"></div>
  </section>

  <section aria-label="Voice sources">
    <h2>Voice sources</h2>
    <p id="sources-summary" class="hint">checking…</p>
    <button id="open-settings" type="button" class="ghost block">Manage voice sources…</button>
  </section>

  <section aria-label="Highlight theme">
    <h2>Highlight theme</h2>
    <div id="theme-swatches" class="swatches" role="radiogroup"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>

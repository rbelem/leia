<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <!-- CWS / Edge small promo tile (440x280). Brand-forward, no text:
       the marching-highlight glyph enlarged, text rows cropping off-canvas
       so the frame stays full edge to edge. -->
